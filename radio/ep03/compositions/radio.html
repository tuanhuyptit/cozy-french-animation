      tl.fromTo(c+' .sway',{rotation:-1},{rotation:1.2,duration:3.1,yoyo:true,repeat:n(3.1,L),ease:'sine.inOut',immediateRender:false},g.s);
      q(c+' .steam').forEach((s,j)=>tl.fromTo(s,{y:0,opacity:0},{y:-40,opacity:.8,duration:2.2,repeat:n(2.2,L),ease:'sine.out',immediateRender:false},g.s+j*1.1));
    });
    TILTS.forEach(h=>tl.to('#lea'+h.k+' .head',{rotation:h.r,duration:.6,ease:'sine.inOut'},h.t-.1));

    // ---- hand gestures, nods, coffee sips (runtimes copied from the demo) ----
    /* GEST-RUNTIME-START (chép nguyên văn vào video bởi tools/build.mjs — chỉ dùng gsap, không random).
   Cần đặt svgOrigin MỘT lần ở t=0: .gest = '257 286', .g-<kiểu> .fore = GEST_ELBOW[kiểu].
   g = {p:kiểu, t:bắt đầu, d:độ dài, b:[mốc chữ để gõ nhịp]} */
const GEST_LIFT={think:35,wave:65,scratch:65,count:40,shrug:40,explain:45,regarde:55,coeur:40,pouce:45,bof:45,pince:45,rire:60,menton:55,poche:15,grand:0};
const GEST_WIG={up:[.7,-12],palm:[1.1,9],think:[1.3,-4],wave:[.36,-18],scratch:[.14,6],shrug:[.9,8],
  explain:[.7,10],regarde:[1.2,-3],coeur:[.5,-5],pouce:[.6,-7],bof:[.32,14],rire:[.18,4],menton:[1,-4],grand:[.5,-8]};
function gestTL(tl,c,g){
  const base=g.p.replace(/T$/,''), el=c+' .g-'+g.p, lift=GEST_LIFT[base]??50, h0=g.t+.32, h1=g.t+g.d-.3, W=GEST_WIG[base];
  tl.set(c+' .armRest',{opacity:0},g.t); tl.set(el,{opacity:1},g.t);
  tl.fromTo(el,{rotation:lift},{rotation:0,duration:.32,ease:'back.out(1.5)',immediateRender:false},g.t);
  if(W){ const w=Math.max(1,Math.round((h1-h0)/W[0]));
    tl.fromTo(el+' .fore',{rotation:0},{rotation:W[1],duration:(h1-h0)/(2*w),yoyo:true,repeat:2*w-1,ease:'sine.inOut',immediateRender:false},h0); }
  if(g.p==='shrug') tl.fromTo(el,{y:0},{y:-10,duration:.28,yoyo:true,repeat:1,ease:'sine.inOut',immediateRender:false},h0);
  if(g.p==='count'){ const n=g.d>2.2?3:2;
    for(let k=1;k<=3;k++) tl.set(c+' .cf'+k,{opacity:0},g.t);
    for(let k=1;k<=n;k++){ const tk=g.t+.3+(k-1)*(g.d-.95)/(n-1);
      tl.set(c+' .cf'+k,{opacity:1},tk);
      tl.fromTo(el+' .fore',{rotation:0},{rotation:-7,duration:.12,yoyo:true,repeat:1,ease:'power2.out',immediateRender:false},tk); }
    for(let k=1;k<=3;k++) tl.set(c+' .cf'+k,{opacity:0},g.t+g.d-.04); }
  if(g.p==='grand'){ tl.set(c+' .swingA',{opacity:0},g.t); tl.set(c+' .swingA',{opacity:1},g.t+g.d-.04); }
  if(g.p==='beat'||g.p==='point'||g.p==='pince'){ const amp={beat:12,point:-7,pince:10}[g.p];
    (g.b||[]).forEach(bt=>{ if(bt>h0&&bt<h1-.2) tl.fromTo(el+' .fore',{rotation:0},{rotation:amp,duration:.11,yoyo:true,repeat:1,ease:'power2.out',immediateRender:false},bt-.04); }); }
  tl.to(el,{rotation:lift,duration:.26,ease:'power2.in'},h1);
  tl.set(el,{opacity:0},g.t+g.d-.04); tl.set(c+' .armRest',{opacity:1},g.t+g.d-.04);
}
/* gật đầu (người nghe đồng ý, hoặc người nói "oui, exactement…"): chỉ dùng y của .head nên không đụng nghiêng đầu khi nói */
function nodTL(tl,c,t){ tl.fromTo(c+' .head',{y:0},{y:7,duration:.17,yoyo:true,repeat:3,ease:'sine.inOut',immediateRender:false},t); }

    GESTS.forEach(g=>gestTL(tl,'#lea'+g.k,{p:g.p,t:g.t,d:g.d,b:g.b}));
    NODS.forEach(x=>nodTL(tl,'#lea'+x.k,x.t));
    /* SIP-RUNTIME-START (chép nguyên văn vào video bởi tools/build.mjs — chỉ dùng gsap, không random).
   người nghe thỉnh thoảng nhấp cà phê (2,6 s bắt đầu từ t): đưa cốc lên miệng, nghiêng, đặt xuống */
function sipTL(tl,c,t){
  tl.set(c+' .armHold',{opacity:0},t); tl.set(c+' .armSip',{opacity:1},t);
  tl.to(c+' .steamGrp',{opacity:0,duration:.2},t); tl.to(c+' .steamGrp',{opacity:1,duration:.6},t+2.3);
  tl.fromTo(c+' .cupGrp',{x:0,y:0},{x:-14,y:-150,duration:.4,ease:'power2.inOut',immediateRender:false},t);
  tl.fromTo(c+' .cupTilt',{rotation:0},{rotation:-18,duration:.4,ease:'power2.inOut',immediateRender:false},t);
  tl.fromTo(c+' .cupTilt',{rotation:-18},{rotation:-28,duration:.6,yoyo:true,repeat:1,ease:'sine.inOut',immediateRender:false},t+.45);
  tl.fromTo(c+' .cupGrp',{x:-14,y:-150},{x:0,y:0,duration:.4,ease:'power2.inOut',immediateRender:false},t+1.75);
  tl.fromTo(c+' .cupTilt',{rotation:-18},{rotation:0,duration:.4,ease:'power2.inOut',immediateRender:false},t+1.75);
  tl.set(c+' .armSip',{opacity:0},t+2.15); tl.set(c+' .armHold',{opacity:1},t+2.15);
}

    SIPS.forEach(x=>sipTL(tl,'#lea'+x.k,x.t));

    // ---- mouth + karaoke ----
    tl.set('.w .ul',{scaleX:0},0);
    WORDS.forEach(w=>{
      const m='#lea'+w.k+' .mouth', len=Math.min(w.e-w.s,.08*w.n+.08), flaps=Math.max(1,Math.round(len/.2)), fd=len/flaps/2;
      for(let k=0;k<flaps;k++) tl.fromTo(m,{scaleY:1},{scaleY:2.4+R()*1.8,transformOrigin:'50% 0%',duration:fd,yoyo:true,repeat:1,ease:'sine.inOut',immediateRender:false},w.s+k*fd*2);
      tl.to('#'+w.id,{color:w.v?w.c[1]:w.c[0],duration:.1},w.s);
      if(w.v) tl.to('#'+w.id+' .ul',{scaleX:1,duration:.35,ease:'power2.out'},w.s);
    });
    SUBS.forEach((s,i)=>s.kin
      ? tl.fromTo('#sub'+i+' .subBox',{y:24,opacity:0},{y:0,opacity:1,duration:.3,ease:'power2.out'},s.s)
      : tl.fromTo('#sub'+i+' .subBox',{y:26,opacity:0},{y:0,opacity:1,duration:.25,ease:'back.out(2)'},s.s));

    // ---- vocab cards ----
    CARDS.forEach((c,i)=>{ const el='#card'+i+' .card';
      tl.fromTo(el,{y:-80,opacity:0,rotation:3},{y:0,opacity:1,rotation:-1.5,duration:.5,ease:'back.out(1.7)'},c.s);
      tl.fromTo('#card'+i+' .ex',{opacity:0,y:10},{opacity:1,y:0,duration:.4},c.s+.5);
      tl.to(el,{y:-50,opacity:0,duration:.3,ease:'power2.in'},c.s+c.d-.35); });

    // ---- recap ----
    tl.fromTo('#recap',{opacity:0},{opacity:1,duration:.5},1326.98);
    tl.fromTo('#recap-title',{y:30,opacity:0},{y:0,opacity:1,duration:.6,ease:'back.out(2)'},1326.98+.2);
    q('#recap .it').forEach((it,i)=>tl.fromTo(it,{y:30,opacity:0},{y:0,opacity:1,duration:.4,ease:'back.out(2)'},1326.98+.7+i*0.300));
    tl.fromTo('#recap-sig',{opacity:0},{opacity:1,duration:.6},1332.38);
    tl.set({}, {}, TOTAL);

    window.__timelines=window.__timelines||{};
    window.__timelines["radio"]=tl;
  })();
  </script>
</template>
